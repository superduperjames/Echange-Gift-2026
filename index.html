<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kabagang Exchange Gift 2026</title>

  <style>
    :root {
      --bg: #f7f4ef;
      --card: #ffffff;
      --text: #242424;
      --muted: #777777;
      --accent: #c43d3d;
      --accent-dark: #a93232;
      --border: #e3ddd5;
      --success: #348052;
      --error: #b43838;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 24px;

background-image: url("https://res.cloudinary.com/eventmobi/image/upload/v1789999844/_James%20Assets/.test%20app%20assets/Abstract%20Backgrounds/19078474_F731.jpg");
background-size: 50%;
background-position: center;
background-repeat: repeat;
background-attachment: fixed;

      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /* CARD */

    .card {
      width: min(100%, 560px);
      padding: 60px 58px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;

      box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.08);
    }

    /* HEADER */

    .gift {
      font-size: 72px;
      line-height: 1;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(38px, 7vw, 45px);
      line-height: 1.05;
      letter-spacing: -2px;
    }

    .intro {
      margin: 0 auto 40px;
      max-width: 460px;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.5;
    }

    /* FORM */

    .field {
      margin-bottom: 22px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 17px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 64px;
      padding: 0 19px;

      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;

      background: #ffffff;
      color: var(--text);

      font-size: 19px;

      transition: 0.2s ease;
    }

    input:focus {
      border-color: var(--accent);

      box-shadow:
        0 0 0 4px rgba(196, 61, 61, 0.10);
    }

    /* BUTTONS */

    .main-button {
      width: 100%;
      height: 64px;
      margin-top: 6px;

      border: 0;
      border-radius: 14px;

      background: var(--accent);
      color: #ffffff;

      font-size: 18px;
      font-weight: 800;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .main-button:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .main-button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    /* SETUP BUTTON ROW */

    .button-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .button-row .main-button {
      flex: 1;
    }

    .secondary-button {
      background: #f1eeea;
      color: #333333;
    }

    .secondary-button:hover {
      background: #e8e3dc;
      color: #333333;
    }

    /* MESSAGE */

    .message {
      min-height: 24px;
      margin-top: 18px;

      color: var(--muted);

      font-size: 15px;
      line-height: 1.5;
    }

    .message.error {
      color: var(--error);
    }

    .message.success {
      color: var(--success);
    }

    /* FORGOT PASSKEY */

    .forgot-button {
      margin-top: 20px;
      padding: 8px;

      border: 0;
      background: transparent;

      color: var(--accent);

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
    }

    .forgot-button:hover {
      text-decoration: underline;
    }

    /* CHANGE PARTICIPANT */

    .change-button {
      display: none;

      margin: 12px auto 0;
      padding: 6px;

      border: 0;
      background: transparent;

      color: #999999;

      font-size: 13px;

      cursor: pointer;
    }

    .change-button:hover {
      color: var(--accent);
    }

    /* RESULT */

    .result {
      display: none;

      margin-top: 34px;
      padding: 32px 22px;

      border-radius: 20px;

      background: #fff7f3;
      border: 1px solid #f1d8cf;
    }

    .result.show {
      display: block;
    }

    .result-label {
      margin-bottom: 10px;

      color: var(--muted);

      font-size: 13px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .assigned {
      color: var(--accent-dark);

      font-size: 36px;
      font-weight: 900;
      line-height: 1.2;

      word-break: break-word;
    }

    .result-note {
      margin-top: 18px;

      color: #999999;

      font-size: 13px;
      line-height: 1.5;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;

      display: none;
      place-items: center;

      padding: 20px;

      background: rgba(20, 20, 20, 0.48);

      z-index: 100;
    }

    .modal.show {
      display: grid;
    }

    .modal-card {
      width: min(100%, 460px);

      padding: 34px;

      background: #ffffff;

      border-radius: 22px;

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.22);
    }

    .modal-card h2 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .modal-card p {
      margin: 0 0 25px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.55;
    }

    .modal-button {
      width: 100%;
      height: 56px;

      border: 0;
      border-radius: 12px;

      background: var(--accent);
      color: #ffffff;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
    }

    .cancel-button {
      margin-top: 10px;

      background: #f1eeea;
      color: #333333;
    }

    .cancel-button:hover {
      background: #e8e3dc;
    }

    /* HIDDEN */

    .hidden {
      display: none !important;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 42px 24px;
        border-radius: 22px;
      }

      .gift {
        font-size: 58px;
      }

      .intro {
        font-size: 17px;
      }

      input,
      .main-button {
        height: 58px;
      }

      .assigned {
        font-size: 30px;
      }
    }

    @media (max-width: 480px) {
      .button-row {
        flex-direction: column;
      }
    }
  </style>
</head>


<body>

  <main class="card">

    <div class="gift">
      🎁
    </div>

    <h1>
      Kabagang Exchange Gift 2026
    </h1>

    <p
      id="intro"
      class="intro"
    >
      Set up your name and passkey to access your exchange gift.
    </p>


    <!-- =====================================================
         SETUP FORM
         ===================================================== -->

    <form id="setupForm">

      <div class="field">

        <label for="setupName">
          Your Name
        </label>

        <input
          id="setupName"
          type="text"
          autocomplete="name"
          placeholder="First Name + Last Name"
          required
        >

      </div>


      <div class="field">

        <label for="setupPasskey">
          Passkey
        </label>

        <input
          id="setupPasskey"
          type="password"
          autocomplete="new-password"
          placeholder="Create your passkey"
          required
        >

      </div>


      <div class="field">

        <label for="setupPasskeyAgain">
          Enter Passkey Again
        </label>

        <input
          id="setupPasskeyAgain"
          type="password"
          autocomplete="new-password"
          placeholder="Enter your passkey again"
          required
        >

      </div>


      <div class="button-row">

        <button
          id="saveButton"
          class="main-button"
          type="submit"
        >
          Save Name and Passkey
        </button>

        <button
          id="setupRevealButton"
          class="main-button secondary-button"
          type="button"
        >
          Reveal
        </button>

      </div>

    </form>


    <!-- =====================================================
         REVEAL FORM
         ===================================================== -->

    <form
      id="revealForm"
      class="hidden"
    >

      <div class="field">

        <label for="revealName">
          Your Name
        </label>

        <input
          id="revealName"
          type="text"
          autocomplete="name"
          placeholder="Enter your name"
          required
        >

      </div>


      <div class="field">

        <label for="revealPasskey">
          Passkey
        </label>

        <input
          id="revealPasskey"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your passkey"
          required
        >

      </div>


      <button
        id="revealButton"
        class="main-button"
        type="submit"
      >
        Reveal
      </button>

    </form>


    <!-- FORGOT PASSKEY -->

    <button
      id="forgotButton"
      class="forgot-button"
      type="button"
    >
      Forgot passkey? Click here to retrieve via email.
    </button>


    <!-- CHANGE PARTICIPANT -->

    <button
      id="changeButton"
      class="change-button"
      type="button"
    >
      Go Back
    </button>


    <div
      id="message"
      class="message"
      aria-live="polite"
    ></div>


    <!-- RESULT -->

    <section
      id="result"
      class="result"
      aria-live="polite"
    >

      <div class="result-label">
        You are giving a gift to
      </div>

      <div
        id="assignedName"
        class="assigned"
      ></div>

      <div class="result-note">
        Keep this a secret! 🤫
      </div>

    </section>

  </main>


  <!-- =======================================================
       FORGOT PASSKEY MODAL
       ======================================================= -->

  <div
    id="forgotModal"
    class="modal"
  >

    <div class="modal-card">

      <h2>
        Forgot your passkey?
      </h2>

      <p>
        Enter your name and the email address registered
        for the exchange. We'll send your saved passkey
        to that email address.
      </p>


      <form id="forgotForm">

        <div class="field">

          <label for="forgotName">
            Your Name
          </label>

          <input
            id="forgotName"
            type="text"
            placeholder="Enter your name"
            required
          >

        </div>


        <div class="field">

          <label for="forgotEmail">
            Email Address
          </label>

          <input
            id="forgotEmail"
            type="email"
            placeholder="you@example.com"
            required
          >

        </div>


        <button
          id="forgotSubmit"
          class="modal-button"
          type="submit"
        >
          Email My Passkey
        </button>


        <button
          id="closeModal"
          class="modal-button cancel-button"
          type="button"
        >
          Cancel
        </button>

      </form>


      <div
        id="forgotMessage"
        class="message"
        aria-live="polite"
      ></div>

    </div>

  </div>


  <script>

    /*
     * ==========================================================
     * GOOGLE APPS SCRIPT WEB APP URL
     * ==========================================================
     */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxP1zfQW1lhgD2H0lGrB4gd_2WOOL670nRst_x3SVVz9s3vBD2jva4mU3mP79kYsYM1QA/exec";


    /*
     * ==========================================================
     * ELEMENTS
     * ==========================================================
     */

    const setupForm =
      document.getElementById(
        "setupForm"
      );

    const revealForm =
      document.getElementById(
        "revealForm"
      );

    const setupName =
      document.getElementById(
        "setupName"
      );

    const setupPasskey =
      document.getElementById(
        "setupPasskey"
      );

    const setupPasskeyAgain =
      document.getElementById(
        "setupPasskeyAgain"
      );

    const saveButton =
      document.getElementById(
        "saveButton"
      );

    const setupRevealButton =
      document.getElementById(
        "setupRevealButton"
      );

    const revealName =
      document.getElementById(
        "revealName"
      );

    const revealPasskey =
      document.getElementById(
        "revealPasskey"
      );

    const revealButton =
      document.getElementById(
        "revealButton"
      );

    const forgotButton =
      document.getElementById(
        "forgotButton"
      );

    const changeButton =
      document.getElementById(
        "changeButton"
      );

    const message =
      document.getElementById(
        "message"
      );

    const result =
      document.getElementById(
        "result"
      );

    const assignedName =
      document.getElementById(
        "assignedName"
      );

    const intro =
      document.getElementById(
        "intro"
      );

    const forgotModal =
      document.getElementById(
        "forgotModal"
      );

    const forgotForm =
      document.getElementById(
        "forgotForm"
      );

    const forgotSubmit =
      document.getElementById(
        "forgotSubmit"
      );

    const forgotMessage =
      document.getElementById(
        "forgotMessage"
      );

    const closeModal =
      document.getElementById(
        "closeModal"
      );

    const forgotName =
      document.getElementById(
        "forgotName"
      );

    const forgotEmail =
      document.getElementById(
        "forgotEmail"
      );


    /*
     * ==========================================================
     * MESSAGES
     * ==========================================================
     */

    function setMessage(
      text,
      type = ""
    ) {

      message.textContent =
        text;

      message.className =
        "message " + type;
    }


    function setForgotMessage(
      text,
      type = ""
    ) {

      forgotMessage.textContent =
        text;

      forgotMessage.className =
        "message " + type;
    }


    /*
     * ==========================================================
     * GOOGLE APPS SCRIPT REQUEST
     * ==========================================================
     *
     * JSONP is used so GitHub Pages can communicate
     * with Google Apps Script.
     */

    function request(data) {

      return new Promise(
        (resolve, reject) => {

          const callbackName =
            "__giftCallback_" +
            Date.now() +
            "_" +
            Math.random()
              .toString(36)
              .substring(2);


          const script =
            document.createElement(
              "script"
            );


          const params =
            new URLSearchParams({
              ...data,
              callback: callbackName
            });


          let finished =
            false;


          const timeout =
            setTimeout(
              () => {

                if (finished) {
                  return;
                }

                finished = true;

                cleanup();

                reject(
                  new Error(
                    "Request timed out."
                  )
                );

              },
              15000
            );


          function cleanup() {

            clearTimeout(
              timeout
            );

            delete window[
              callbackName
            ];

            script.remove();
          }


          window[
            callbackName
          ] = response => {

            if (finished) {
              return;
            }

            finished = true;

            cleanup();

            resolve(
              response
            );
          };


          script.onerror =
            () => {

              if (finished) {
                return;
              }

              finished = true;

              cleanup();

              reject(
                new Error(
                  "Could not contact Google Apps Script."
                )
              );
            };


          script.src =
            API_URL +
            "?" +
            params.toString();


          document.body.appendChild(
            script
          );

        }
      );
    }


    /*
     * ==========================================================
     * SHOW REVEAL MODE
     * ==========================================================
     */

    function showRevealMode(name = "") {

      setupForm.classList.add(
        "hidden"
      );

      revealForm.classList.remove(
        "hidden"
      );

      intro.textContent =
        "Enter your name and passkey to reveal the person you're giving a gift to.";

      forgotButton.style.display =
        "inline-block";

      changeButton.style.display =
        "block";

      if (name) {
        revealName.value =
          name;
      }

      revealPasskey.value =
        "";

      setMessage("");

      result.classList.remove(
        "show"
      );

      assignedName.textContent =
        "";
    }


    /*
     * ==========================================================
     * SHOW SETUP MODE
     * ==========================================================
     */

    function showSetupMode() {

      setupForm.classList.remove(
        "hidden"
      );

      revealForm.classList.add(
        "hidden"
      );

      intro.textContent =
        "Set up your name and passkey to access your exchange gift.";

      forgotButton.style.display =
        "inline-block";

      changeButton.style.display =
        "none";

      setMessage("");

      result.classList.remove(
        "show"
      );

      assignedName.textContent =
        "";
    }


    /*
     * ==========================================================
     * SAVE NAME + PASSKEY
     * ==========================================================
     */

    setupForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const name =
          setupName.value.trim();

        const passkey =
          setupPasskey.value;

        const passkeyAgain =
          setupPasskeyAgain.value;


        if (!name) {

          setMessage(
            "Please enter your name.",
            "error"
          );

          return;
        }


        if (!passkey) {

          setMessage(
            "Please create a passkey.",
            "error"
          );

          return;
        }


        if (passkey.length < 4) {

          setMessage(
            "Your passkey must be at least 4 characters.",
            "error"
          );

          return;
        }


        if (
          passkey !==
          passkeyAgain
        ) {

          setMessage(
            "The two passkeys don't match.",
            "error"
          );

          return;
        }


        saveButton.disabled =
          true;

        setupRevealButton.disabled =
          true;

        saveButton.textContent =
          "Saving...";

        setMessage(
          "Saving your name and passkey..."
        );


        try {

          const data =
            await request({

              action:
                "register",

              name:
                name,

              passkey:
                passkey,

              confirmPasskey:
                passkeyAgain

            });


          if (!data.ok) {

            setMessage(
              data.message ||
              "We couldn't save your information.",
              "error"
            );

            return;
          }


          localStorage.setItem(
            "exchangeGiftName",
            name
          );


          showRevealMode(
            name
          );


          setMessage(
            "Your passkey has been saved. You can now reveal your recipient.",
            "success"
          );


          setTimeout(
            () => {
              revealPasskey.focus();
            },
            0
          );

        }


        catch (error) {

          setMessage(
            "The gift list is temporarily unavailable. Please try again.",
            "error"
          );

        }


        finally {

          saveButton.disabled =
            false;

          setupRevealButton.disabled =
            false;

          saveButton.textContent =
            "Save Name and Passkey";
        }

      }
    );


    /*
     * ==========================================================
     * SETUP SCREEN → REVEAL SCREEN
     * ==========================================================
     */

    setupRevealButton.addEventListener(
      "click",
      () => {

        const name =
          setupName.value.trim();

        showRevealMode(
          name
        );

        setTimeout(
          () => {

            if (name) {
              revealPasskey.focus();
            } else {
              revealName.focus();
            }

          },
          0
        );

      }
    );


    /*
     * ==========================================================
     * REVEAL RECIPIENT
     * ==========================================================
     */

    revealForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const name =
          revealName.value.trim();

        const passkey =
          revealPasskey.value;


        if (
          !name ||
          !passkey
        ) {

          setMessage(
            "Please enter your name and passkey.",
            "error"
          );

          return;
        }


        revealButton.disabled =
          true;

        revealButton.textContent =
          "Checking...";

        setMessage(
          "Checking your passkey..."
        );

        result.classList.remove(
          "show"
        );


        try {

          const data =
            await request({

              action:
                "reveal",

              name:
                name,

              passkey:
                passkey

            });


          if (!data.ok) {

            setMessage(
              data.message ||
              "We couldn't verify your passkey.",
              "error"
            );

            return;
          }


          localStorage.setItem(
            "exchangeGiftName",
            name
          );


          assignedName.textContent =
            data.assigned;


          result.classList.add(
            "show"
          );


          setMessage("");

        }


        catch (error) {

          setMessage(
            "The gift list is temporarily unavailable. Please try again.",
            "error"
          );

        }


        finally {

          revealButton.disabled =
            false;

          revealButton.textContent =
            "Reveal";
        }

      }
    );


    /*
     * ==========================================================
     * FORGOT PASSKEY MODAL
     * ==========================================================
     */

    forgotButton.addEventListener(
      "click",
      () => {

        forgotModal.classList.add(
          "show"
        );

        setForgotMessage("");

        const currentName =
          revealForm.classList.contains(
            "hidden"
          )
            ? setupName.value.trim()
            : revealName.value.trim();


        if (currentName) {
          forgotName.value =
            currentName;
        }


        setTimeout(
          () => {

            if (currentName) {
              forgotEmail.focus();
            } else {
              forgotName.focus();
            }

          },
          0
        );

      }
    );


    closeModal.addEventListener(
      "click",
      () => {

        forgotModal.classList.remove(
          "show"
        );

      }
    );


    forgotModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          forgotModal
        ) {

          forgotModal.classList.remove(
            "show"
          );

        }

      }
    );


    /*
     * ==========================================================
     * RETRIEVE PASSKEY VIA EMAIL
     * ==========================================================
     */

    forgotForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const name =
          forgotName.value.trim();

        const email =
          forgotEmail.value.trim();


        if (
          !name ||
          !email
        ) {

          setForgotMessage(
            "Please enter your name and email address.",
            "error"
          );

          return;
        }


        forgotSubmit.disabled =
          true;

        forgotSubmit.textContent =
          "Sending...";

        setForgotMessage(
          "Checking your information..."
        );


        try {

          const data =
            await request({

              action:
                "forgot",

              name:
                name,

              email:
                email

            });


          if (data.ok) {

            setForgotMessage(
              data.message,
              "success"
            );

          } else {

            setForgotMessage(
              data.message ||
              "We couldn't verify those details.",
              "error"
            );

          }

        }


        catch (error) {

          setForgotMessage(
            "Something went wrong. Please try again.",
            "error"
          );

        }


        finally {

          forgotSubmit.disabled =
            false;

          forgotSubmit.textContent =
            "Email My Passkey";
        }

      }
    );


    /*
     * ==========================================================
     * USE DIFFERENT PARTICIPANT
     * ==========================================================
     */

    changeButton.addEventListener(
      "click",
      () => {

        localStorage.removeItem(
          "exchangeGiftName"
        );


        revealName.value =
          "";

        revealPasskey.value =
          "";

        setupName.value =
          "";

        setupPasskey.value =
          "";

        setupPasskeyAgain.value =
          "";


        showSetupMode();


        setMessage(
          "You can now set up another participant."
        );


        setupName.focus();

      }
    );


    /*
     * ==========================================================
     * INITIAL PAGE LOAD
     * ==========================================================
     *
     * If this browser has previously registered/revealed,
     * take them directly to the Reveal screen.
     */

    const savedName =
      localStorage.getItem(
        "exchangeGiftName"
      );


    if (savedName) {

      showRevealMode(
        savedName
      );

    } else {

      showSetupMode();

    }

  </script>

</body>
</html>
